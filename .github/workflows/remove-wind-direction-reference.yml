name: Remove wind direction reference

on:
  push:
    paths:
      - '.github/workflows/remove-wind-direction-reference.yml'

permissions:
  contents: write

jobs:
  cleanup-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove direction reference panel
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the entire wind-direction reference panel while keeping KPI cards.
          s = re.sub(r'<div class="p dirref">.*?</div><div id=k class=k></div>', '<div id=k class=k></div>', s, count=1, flags=re.S)

          # Remove styles used only by the direction reference panel.
          s = s.replace('.dirref{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:center}.dirsvg{width:100%;max-width:340px;height:auto;margin:auto;display:block}.dircopy{line-height:1.65}.dircopy b{font-size:14px}@media(max-width:760px){.dirref{grid-template-columns:1fr}}', '')

          p.write_text(s, encoding='utf-8')
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove wind direction reference panel"
          git push
